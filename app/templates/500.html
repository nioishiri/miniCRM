{% extends "base.html" %}
{% block title %}Ошибка сервера — CRM{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card-crm animate-in">
      <div class="card-body p-5 text-center">
        <i class="bi bi-exclamation-octagon" style="font-size:3rem; color:var(--danger);"></i>
        <h1 class="page-header mt-3">Внутренняя ошибка сервера</h1>
        <p class="text-muted">Что-то пошло не так. Ошибка записана в лог сервера.<br>
        Попробуйте обновить страницу или вернуться на главную.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-crm btn-crm-primary mt-2">
          <i class="bi bi-house me-1"></i> На главную
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
